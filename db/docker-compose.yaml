services:
  postgres-lakehouse:
    image: postgres:17-alpine
    container_name: postgres-lakehouse
    restart: always
    environment:
      POSTGRES_DB: project_bigdata_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - lakehouse-data:/var/lib/postgresql/data
      - ./init_lakehouse.sql:/docker-entrypoint-initdb.d/init_lakehouse.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d project_bigdata_db"]
      interval: 10s
      retries: 5
      start_period: 5s

volumes:
  lakehouse-data:
